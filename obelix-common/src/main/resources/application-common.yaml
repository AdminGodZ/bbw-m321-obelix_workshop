spring:
  datasource:
    url: jdbc:h2:mem:obelixdb
  jpa:
    open-in-view: on
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
