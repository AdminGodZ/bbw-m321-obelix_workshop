services:
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "127.0.0.1:9411:9411"
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data:
